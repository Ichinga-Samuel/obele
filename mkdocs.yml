site_name: obele
site_description: A lightweight, async-ready ORM for SQLite
site_author: Ichinga Samuel
site_url: https://ichinga-samuel.github.io/obele/

repo_name: ichinga-samuel/obele
repo_url: https://github.com/ichinga-samuel/obele

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide: user_guide.md
  - API Reference:
      - ORM: api/orm.md
      - Fields: api/fields.md
      - Queries: api/queries.md
      - Key-Value Store: api/kv.md
