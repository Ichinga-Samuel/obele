site_name: obele
site_description: A lightweight, async-ready ORM and key-value store for SQLite
site_author: Ichinga Samuel
site_url: https://ichinga-samuel.github.io/obele/

repo_name: ichinga-samuel/obele
repo_url: https://github.com/ichinga-samuel/obele

theme:
  name: readthedocs
  navigation_depth: 4
  collapse_navigation: false

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide: user_guide.md
  - Architecture: architecture.md
  - Complete Source Reference: internals.md
  - Migration CLI: cli.md
  - API Reference:
      - ORM: api/orm.md
      - Fields: api/fields.md
      - Queries: api/queries.md
      - Key-Value Store: api/kv.md
      - Signals and Errors: api/signals_errors.md
